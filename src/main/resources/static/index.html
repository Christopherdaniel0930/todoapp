<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            transition: 0.3s;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        body.dark { background: #121212; color: white; }
        .container {
            background: white;
            width: min(95vw, 560px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        body.dark .container { background: #000; }
        h2 { text-align: center; margin-top: 0; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        button {
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .add-btn {
            width: 100%;
            background: #4e73df;
            color: white;
            font-weight: bold;
        }
        .add-btn:hover { background: #2e59d9; transform: scale(1.01); }
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            background: #f8f9fc;
            animation: fadeIn 0.25s ease;
        }
        body.dark .task { background: #2a2a2a; }
        .task-content { overflow-wrap: anywhere; }
        .completed { text-decoration: line-through; color: gray; }
        .task-buttons button { margin-left: 5px; }
        .complete-btn { background: #1cc88a; color: white; }
        .delete-btn { background: #d9534f; color: white; }
        .toggle-mode { margin-bottom: 10px; background: #101010; color: white; }
        body.dark .toggle-mode { background: white; color: #2b2828; }
        .status { font-size: 0.9rem; min-height: 1.2rem; color: #b00020; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Todo App</h2>
    <button class="toggle-mode" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <input type="text" id="title" placeholder="Task Title" maxlength="100">
    <input type="text" id="description" placeholder="Task Description" maxlength="300">
    <button class="add-btn" onclick="addTask()">Add Task</button>
    <div class="status" id="statusMessage"></div>

    <hr>

    <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="applyFilters()">
    <select id="filterSelect" onchange="applyFilters()">
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
    </select>

    <div id="taskList"></div>
</div>

<script>
    const API_URL = "/tasks";
    let allTasks = [];

    const statusMessage = document.getElementById("statusMessage");

    function setStatus(message = "", isError = false) {
        statusMessage.textContent = message;
        statusMessage.style.color = isError ? "#b00020" : "#117a65";
    }

    async function fetchTasks() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`Failed to fetch tasks (${res.status})`);
            allTasks = await res.json();
            applyFilters();
            setStatus("");
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    function applyFilters() {
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        const filter = document.getElementById("filterSelect").value;

        const filtered = allTasks.filter(task => {
            const title = (task.title || "").toLowerCase();
            const description = (task.description || "").toLowerCase();
            const matchesSearch = title.includes(searchText) || description.includes(searchText);

            const matchesFilter = filter === "all" ||
                (filter === "completed" && task.completed) ||
                (filter === "pending" && !task.completed);

            return matchesSearch && matchesFilter;
        });

        renderTasks(filtered);
    }

    function renderTasks(tasks) {
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = "";

        if (tasks.length === 0) {
            taskList.innerHTML = "<p>No tasks found.</p>";
            return;
        }

        tasks.forEach(task => {
            const div = document.createElement("div");
            div.className = "task";

            div.innerHTML = `
                <div class="task-content ${task.completed ? 'completed' : ''}">
                    <strong>${task.title || '(Untitled task)'}</strong><br>
                    <small>${task.description || ''}</small>
                </div>
                <div class="task-buttons">
                    <button class="complete-btn" onclick="toggleComplete(${task.id}, ${task.completed})">
                        ${task.completed ? 'Undo' : 'Done'}
                    </button>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            `;

            taskList.appendChild(div);
        });
    }

    async function addTask() {
        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();

        if (!title) {
            setStatus("Task title is required.", true);
            return;
        }

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, completed: false })
            });

            if (!res.ok) throw new Error(`Failed to add task (${res.status})`);

            document.getElementById("title").value = "";
            document.getElementById("description").value = "";
            setStatus("Task added successfully.");
            await fetchTasks();
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    async function deleteTask(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            if (!res.ok) throw new Error(`Failed to delete task (${res.status})`);
            setStatus("Task deleted.");
            await fetchTasks();
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    async function toggleComplete(id, completed) {
        try {
            const taskRes = await fetch(`${API_URL}/${id}`);
            if (!taskRes.ok) throw new Error(`Task not found (${taskRes.status})`);
            const task = await taskRes.json();

            const updateRes = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title: task.title,
                    description: task.description,
                    completed: !completed
                })
            });

            if (!updateRes.ok) throw new Error(`Failed to update task (${updateRes.status})`);
            setStatus("Task updated.");
            await fetchTasks();
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }

    fetchTasks();
</script>
</body>
</html>
