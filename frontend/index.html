<!DOCTYPE html>
<html lang="en">
<head>
    <title>Advanced Todo App</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            transition: 0.3s;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        body.dark {
            background: #121212;
            color: white;
        }

        .container {
            background: white;
            width: 500px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        body.dark .container {
            background: #000000;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        button {
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn {
            width: 100%;
            background: #4e73df;
            color: white;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #2e59d9;
            transform: scale(1.02);
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            background: #f8f9fc;
            animation: fadeIn 0.4s ease;
            transition: 0.3s;
        }

        body.dark .task {
            background: #2a2a2a;
        }

        .task:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .task-buttons button {
            margin-left: 5px;
        }

        .complete-btn {
            background: #1cc88a;
            color: white;
        }

        .delete-btn {
            background: #5dbc9b;
            color: white;
        }

        .toggle-mode {
            margin-bottom: 10px;
            background: #101010;
            color: white;
        }

        body.dark .toggle-mode {
            background: white;
            color: #2b2828;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Todo App</h2>

    <button class="toggle-mode" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <input type="text" id="title" placeholder="Task Title">
    <input type="text" id="description" placeholder="Task Description">
    <button class="add-btn" onclick="addTask()">Add Task</button>

    <hr>

    <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="applyFilters()">

    <select id="filterSelect" onchange="applyFilters()">
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
    </select>

    <div id="taskList"></div>
</div>

<script>

    const API_URL = "http://localhost:8080/tasks";
    let allTasks = [];

    function fetchTasks() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                allTasks = data;
                applyFilters();
            });
    }

    function applyFilters() {
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        const filter = document.getElementById("filterSelect").value;

        const filtered = allTasks.filter(task => {
            const matchesSearch =
                task.title.toLowerCase().includes(searchText) ||
                task.description.toLowerCase().includes(searchText);

            const matchesFilter =
                filter === "all" ||
                (filter === "completed" && task.completed) ||
                (filter === "pending" && !task.completed);

            return matchesSearch && matchesFilter;
        });

        renderTasks(filtered);
    }

    function renderTasks(tasks) {
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = "";

        tasks.forEach(task => {
            const div = document.createElement("div");
            div.className = "task";

            div.innerHTML = `
            <div class="${task.completed ? 'completed' : ''}">
                <strong>${task.title}</strong><br>
                <small>${task.description}</small>
            </div>
            <div class="task-buttons">
                <button class="complete-btn"
                    onclick="toggleComplete(${task.id}, ${task.completed})">
                    ${task.completed ? 'Undo' : 'Done'}
                </button>
                <button class="delete-btn"
                    onclick="deleteTask(${task.id})">
                    Delete
                </button>
            </div>
        `;

            taskList.appendChild(div);
        });
    }

    function addTask() {
        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title,
                description,
                completed: false
            })
        }).then(() => {
            document.getElementById("title").value = "";
            document.getElementById("description").value = "";
            fetchTasks();
        });
    }

    function deleteTask(id) {
        fetch(`${API_URL}/${id}`, { method: "DELETE" })
            .then(() => fetchTasks());
    }

    function toggleComplete(id, completed) {
        fetch(`${API_URL}/${id}`)
            .then(res => res.json())
            .then(task => {
                fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: task.title,
                        description: task.description,
                        completed: !completed
                    })
                }).then(() => fetchTasks());
            });
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }

    fetchTasks();

</script>

</body>
</html>
